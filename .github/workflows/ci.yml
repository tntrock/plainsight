name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Smoke test the CLI on a sample capture
        shell: bash
        run: |
          python tests/traffic.py lab.pcap
          plainsight pcap lab.pcap --report | tee report.txt
          grep -q "Sup3rS3cret!" report.txt
