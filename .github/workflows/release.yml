name: Release

# Push a tag like v0.2.0 to build PlainSight.exe and publish it as a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" pyinstaller
      - run: pytest -q
      - run: pyinstaller --noconfirm --clean packaging/plainsight.spec
      - name: Smoke test the exe
        shell: pwsh
        run: |
          ./dist/PlainSight.exe --version
          python tests/traffic.py lab.pcap
          $report = ./dist/PlainSight.exe pcap lab.pcap --report | Out-String
          Write-Output $report
          if ($report -notmatch "Sup3rS3cret!") { throw "exe did not find the test password" }
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $hash = (Get-FileHash dist/PlainSight.exe -Algorithm SHA256).Hash.ToLower()
          # LF line ending so `sha256sum -c` works on Linux / macOS / Git Bash.
          [IO.File]::WriteAllText("dist/SHA256SUMS.txt", "$hash  PlainSight.exe`n")
          $notes = @"
          ## 下載

          **PlainSight.exe**：Windows 10/11 64 位元，免安裝，雙擊即可執行。

          - 第一次執行若出現 SmartScreen「Windows 已保護您的電腦」，請按「其他資訊 → 仍要執行」（本程式未經程式碼簽章）。
          - 即時擷取可直接使用 Windows 內建方式（需系統管理員）；選單中的「安裝 Npcap」可一鍵從官網安裝以取得完整功能。
          - SHA256：``$hash``

          僅供教育與授權測試使用，請先閱讀 README 的「使用前必讀」。
          "@
          gh release create "${{ github.ref_name }}" dist/PlainSight.exe dist/SHA256SUMS.txt --title "PlainSight ${{ github.ref_name }}" --notes $notes
